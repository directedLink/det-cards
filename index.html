<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --fg: #1d2129; --muted: #6b7180; --line: #e2e0d8;
  --accent: #2f5bd3; --accent-fg: #ffffff; --good: #1f8a5b; --bad: #c8412f; --chip: #eceae3;
  --display: Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171c; --surface: #1e2128; --fg: #eceef2; --muted: #9aa0ad; --line: #2e323b;
  --accent: #7d9bff; --accent-fg: #0f1320; --good: #4cc38a; --bad: #ff7a66; --chip: #2a2e37; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15171c; --surface: #1e2128; --fg: #eceef2; --muted: #9aa0ad; --line: #2e323b;
  --accent: #7d9bff; --accent-fg: #0f1320; --good: #4cc38a; --bad: #ff7a66; --chip: #2a2e37; color-scheme: dark }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 520px; margin: 0 auto; padding-block: 16px 32px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--display); font-size: 26px; margin: 0; }
h2 { font-size: 13px; letter-spacing: 0.08em; color: var(--muted); margin: 0; font-weight: 600; }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; font-weight: 600; }
.stat span { font-size: 12px; color: var(--muted); }
.days { display: flex; flex-direction: column; gap: 8px; }
.day { display: grid; grid-template-columns: 64px 1fr 82px; align-items: center; gap: 10px; font-size: 13px; }
.day .bar { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.day .bar i { display: block; height: 100%; background: var(--accent); }
.day .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-weight: 600;
  border-radius: 12px; padding: 14px 16px; cursor: pointer; text-align: center; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn:focus-visible, .seg button:focus-visible, .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.seg { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 8px 4px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.study { min-height: 100%; display: flex; flex-direction: column; gap: 14px; max-width: 520px; margin: 0 auto; padding-block: 12px 20px; box-sizing: border-box; }
.top { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.top .bar { flex: 1; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.top .bar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.icon { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; padding: 8px; cursor: pointer; border-radius: 8px; }
.card { flex: 1; min-height: 300px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; padding: 24px 18px; text-align: center; cursor: pointer; position: relative; }
.word { font-family: var(--display); font-size: clamp(38px, 11vw, 58px); line-height: 1.1; word-break: break-word; }
.hint { font-size: 13px; color: var(--muted); }
.gloss { font-size: 22px; font-weight: 600; }
.tag { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.speak { position: absolute; top: 10px; right: 10px; }
.verdict { font-size: 15px; font-weight: 600; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }
.answer { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.answer .btn { padding: 18px 10px; font-size: 17px; }
.btn.good { border-color: var(--good); color: var(--good); }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.list { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow: auto; }
.list div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding: 6px 0; font-size: 14px; }
.list span:last-child { color: var(--muted); text-align: right; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div id="loading" class="wrap"><h1>DET 词汇冲刺</h1><p class="note">正在读取词库和进度…</p></div>

<div id="importView" class="wrap" hidden>
  <header><h1>DET 词汇冲刺</h1><p class="sub">第一次使用：导入词库（只需一次）</p></header>
  <section class="panel">
    <p class="note">选择文件 <b>DET_data.json</b>。导入后词库保存在本账号的存储里，以后打开直接用。</p>
    <input type="file" id="fileIn" accept=".json,application/json">
    <p class="note" id="importMsg" role="status"></p>
  </section>
</div>

<div id="home" class="wrap" hidden>
  <header>
    <h1>DET 词汇冲刺</h1>
    <p class="sub" id="homeSub">Read and Select</p>
  </header>
  <section class="panel" aria-label="总进度">
    <div class="stats">
      <div class="stat"><b id="sSeen">0</b><span>已见过</span></div>
      <div class="stat"><b id="sBad">0</b><span>不认识待复习</span></div>
      <div class="stat"><b id="sToday">0</b><span>今日已刷</span></div>
    </div>
    <div class="days" id="days"></div>
  </section>
  <section class="panel" aria-label="开始">
    <button class="btn primary" id="goLearn">开始学习</button>
    <div class="row">
      <button class="btn" id="goQuiz">真假词测试</button>
      <button class="btn" id="goReview">复习不认识</button>
    </div>
    <p class="note" id="nextNote"></p>
  </section>
  <section class="panel" aria-label="设置">
    <h2>设置</h2>
    <div class="field">每组数量<div class="seg" id="segN" role="group" aria-label="每组数量"></div></div>
    <div class="field">新词来源<div class="seg" id="segScope" role="group" aria-label="新词来源"></div></div>
    <label class="check"><input type="checkbox" id="autoSpeak"> 出词时自动发音</label>
  </section>
  <section class="panel" aria-label="进度保存">
    <h2>进度保存</h2>
    <p class="note" id="syncMsg" role="status"></p>
    <button class="btn" id="resetBtn">清空全部进度</button>
  </section>
</div>

<div id="study" class="study" hidden>
  <div class="top">
    <button class="icon" id="quit" aria-label="返回首页">← 返回</button>
    <div class="bar"><i id="pbar" style="width:0%"></i></div>
    <span id="pnum">0/0</span>
  </div>
  <div class="card" id="card" tabindex="0" role="button" aria-live="polite">
    <button class="icon speak" id="speakBtn" aria-label="发音">🔊</button>
    <div class="word" id="cWord"></div>
    <div id="cBack" hidden>
      <div class="gloss" id="cGloss"></div>
      <div style="margin-top:8px"><span class="tag" id="cTag"></span></div>
    </div>
    <div class="verdict" id="cVerdict" hidden></div>
    <div class="hint" id="cHint">点卡片看释义</div>
  </div>
  <div class="answer" id="ansLearn">
    <button class="btn bad" id="bNo">不认识</button>
    <button class="btn good" id="bYes">认识</button>
  </div>
  <div class="answer" id="ansQuiz" hidden>
    <button class="btn" id="bFake">假词</button>
    <button class="btn" id="bReal">真词</button>
  </div>
  <button class="btn primary" id="bNext" hidden>下一个</button>
</div>

<div id="done" class="wrap" hidden>
  <header><h1 id="dTitle">本组完成</h1><p class="sub" id="dSub"></p></header>
  <section class="panel"><h2 id="dListTitle">需要复习</h2><div class="list" id="dList"></div></section>
  <div class="row">
    <button class="btn primary" id="dAgain">再来一组</button>
    <button class="btn" id="dHome">回首页</button>
  </div>
</div>

<script>
// ===================== STORAGE ADAPTER =====================
// The only part that talks to persistent storage. Values are strings.
// Uses claude.ai's artifact storage (window.storage) when present, otherwise browser localStorage.
const Store = {
  cloud: !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function'),
  async get(key) {
    if (this.cloud) {
      try { const r = await window.storage.get(key); return r == null ? null : (typeof r === 'string' ? r : r.value ?? null); }
      catch (e) { return null; }   // missing key throws in some versions
    }
    try { return localStorage.getItem(key); } catch (e) { return null; }
  },
  async set(key, value) {
    if (this.cloud) { await window.storage.set(key, value); return; }
    localStorage.setItem(key, value);
  },
  async del(key) {
    if (this.cloud) { try { await window.storage.delete(key); } catch (e) {} return; }
    try { localStorage.removeItem(key); } catch (e) {}
  }
};
// ============================================================

const CHUNK = 90000;           // characters per stored value
const CAT = ['GRE大词', '短小俗词', '其他'];
let W = [];   // [word, gloss, cat(0 GRE,1 俗词,2 其他), day]
let F = [];   // [fake, sourceWord]
const $ = id => document.getElementById(id);
function show(id) { for (const v of ['loading', 'importView', 'home', 'study', 'done']) $(v).hidden = v !== id; window.scrollTo(0, 0); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ---------- big values split across keys ----------
async function setBig(key, str) {
  const n = Math.ceil(str.length / CHUNK);
  for (let i = 0; i < n; i++) await Store.set(key + '_' + i, str.slice(i * CHUNK, (i + 1) * CHUNK));
  await Store.set(key + '_n', String(n));
}
async function getBig(key) {
  const n = parseInt(await Store.get(key + '_n'), 10);
  if (!n) return null;
  let s = '';
  for (let i = 0; i < n; i++) { const part = await Store.get(key + '_' + i); if (part == null) return null; s += part; }
  return s;
}

// ---------- word data ----------
async function loadData() {
  if (window.EMBED) { W = window.EMBED.words; F = window.EMBED.fakes; return true; }
  const s = await getBig('det_data');
  if (!s) return false;
  try { const d = JSON.parse(s); W = d.words; F = d.fakes; return W.length > 0; } catch (e) { return false; }
}
$('fileIn').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  $('importMsg').textContent = '正在导入…';
  try {
    const text = await f.text();
    const d = JSON.parse(text);
    if (!Array.isArray(d.words) || !Array.isArray(d.fakes) || d.words.length < 100) throw new Error('文件内容不对');
    await setBig('det_data', JSON.stringify({ words: d.words, fakes: d.fakes }));
    W = d.words; F = d.fakes;
    $('importMsg').textContent = `导入成功：${W.length} 个词，${F.length} 个假词。`;
    await loadProgress(); renderHome(); show('home');
  } catch (err) {
    $('importMsg').textContent = '导入失败：' + (err && err.message ? err.message : err) + '。请确认选的是 DET_data.json。';
  }
});

// ---------- progress ----------
// p[i] = [status 1 known / 2 unknown, timesSeen, lastSeen (minutes since 1970), timesWrong]
// stored per planned day (det_p_1 … det_p_6) so each save writes one small value
function blank() { return { p: {}, set: { n: 30, scope: 'plan', auto: false }, today: { d: '', c: 0 } }; }
let S = blank();
const dirty = new Set(); let metaDirty = false, saveT = null, saving = false;
function nowMin() { return Math.floor(Date.now() / 60000); }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
async function loadProgress() {
  const fresh = blank();
  try { const m = await Store.get('det_meta'); if (m) { const o = JSON.parse(m); fresh.set = Object.assign(fresh.set, o.set); if (o.today) fresh.today = o.today; } } catch (e) {}
  for (let d = 1; d <= 6; d++) {
    try { const s = await Store.get('det_p_' + d); if (s) Object.assign(fresh.p, JSON.parse(s)); } catch (e) {}
  }
  // keep local answers that are newer than what was stored (e.g. a save still pending)
  for (const k in S.p) { const r = fresh.p[k]; if (!r || S.p[k][2] > r[2] || (S.p[k][2] === r[2] && S.p[k][1] > r[1])) fresh.p[k] = S.p[k]; }
  S = fresh;
}
function queue(i) {
  if (i !== undefined) dirty.add(W[i][3]);
  metaDirty = true;
  clearTimeout(saveT); saveT = setTimeout(flush, 1200);
}
async function flush() {
  clearTimeout(saveT);
  if (saving) { saveT = setTimeout(flush, 600); return; }
  if (!dirty.size && !metaDirty) return;
  saving = true;
  const days = [...dirty]; dirty.clear(); const meta = metaDirty; metaDirty = false;
  try {
    for (const d of days) {
      const part = {};
      for (const k in S.p) if (W[k] && W[k][3] === d) part[k] = S.p[k];
      await Store.set('det_p_' + d, JSON.stringify(part));
    }
    if (meta) await Store.set('det_meta', JSON.stringify({ set: S.set, today: S.today }));
    setSyncOk();
  } catch (e) {
    days.forEach(d => dirty.add(d)); metaDirty = true;
    $('syncMsg').textContent = '⚠ 保存失败（' + (e && e.message ? e.message : e) + '），稍后会自动重试。';
    saveT = setTimeout(flush, 5000);
  } finally { saving = false; }
}
function setSyncOk() {
  if (window.EMBED && !Store.cloud) {
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    const standalone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    $('syncMsg').textContent = standalone ? '✓ 进度自动保存在这台手机上，下次从桌面图标打开会接着来。'
      : '提示：在 Safari 里点“分享 → 添加到主屏幕”，以后从桌面图标打开，进度会一直保存在手机上。';
    return;
  }
  $('syncMsg').textContent = Store.cloud
    ? '✓ 进度自动保存在你的 Claude 账号里，换设备用同一账号打开会接着来。'
    : '⚠ 当前环境没有 Claude 存储，进度只存在这个浏览器里。';
}
function bumpToday() { const t = todayStr(); if (S.today.d !== t) S.today = { d: t, c: 0 }; S.today.c++; }
function mark(i, known) {
  const r = (S.p[i] || [0, 0, 0, 0]).slice();
  r[0] = known ? 1 : 2; r[1]++; r[2] = nowMin(); if (!known) r[3]++;
  S.p[i] = r; bumpToday(); queue(i);
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'hidden') flush();
  else if (!$('home').hidden && W.length) { await loadProgress(); renderHome(); }   // pick up progress from another device
});

// ---------- picking ----------
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function unseen() { const out = []; for (let i = 0; i < W.length; i++) if (!S.p[i]) out.push(i); return out; }
function pickNew(k) {
  const pool = unseen();
  if (S.set.scope === 'all') return shuffle(pool).slice(0, k);
  const res = [];   // earliest day that still has unseen words first, random inside that day
  for (let d = 1; d <= 6 && res.length < k; d++) res.push(...shuffle(pool.filter(i => W[i][3] === d)).slice(0, k - res.length));
  return res;
}
function byStatus(s) { return Object.keys(S.p).filter(i => S.p[i][0] === s).map(Number); }
function buildLearn(n) {
  const bad = byStatus(2).sort((a, b) => S.p[a][2] - S.p[b][2]).slice(0, Math.ceil(n * 0.3));
  const known = byStatus(1).sort((a, b) => S.p[a][2] - S.p[b][2]);   // oldest first
  const kNum = Math.min(known.length, Math.round(n * 0.1));
  const back = shuffle(known.slice(0, Math.max(kNum, Math.ceil(known.length / 2)))).slice(0, kNum);
  return shuffle([...bad, ...back, ...pickNew(n - bad.length - back.length)]);
}

// ---------- home ----------
function renderHome() {
  const seen = Object.keys(S.p).length, bad = byStatus(2).length;
  $('homeSub').textContent = `Read and Select · ${W.length} 词`;
  $('sSeen').textContent = seen; $('sBad').textContent = bad;
  $('sToday').textContent = S.today.d === todayStr() ? S.today.c : 0;
  let html = '';
  for (let d = 1; d <= 6; d++) {
    let tot = 0, s = 0;
    for (let i = 0; i < W.length; i++) if (W[i][3] === d) { tot++; if (S.p[i]) s++; }
    html += `<div class="day"><span>第${d}天</span><div class="bar"><i style="width:${tot ? (s / tot * 100).toFixed(1) : 0}%"></i></div><span class="num">${s}/${tot}</span></div>`;
  }
  html += `<div class="day"><span>第7天</span><span class="note">复习所有“不认识”的词</span><span class="num">${bad} 个</span></div>`;
  $('days').innerHTML = html;
  $('goReview').disabled = bad === 0;
  $('goQuiz').disabled = seen === 0;
  const left = W.length - seen;
  $('nextNote').textContent = left ? `开始学习会抽 ${S.set.n} 个：先补不认识的，再加少量旧词，其余是没见过的新词。还剩 ${left} 个新词。`
                                   : '全部词都见过了。用“复习不认识”和“真假词测试”巩固。';
  $('segN').innerHTML = [20, 30, 50, 80].map(v => `<button type="button" aria-pressed="${S.set.n === v}" data-n="${v}">${v}</button>`).join('');
  $('segScope').innerHTML = [['plan', '按天数顺序'], ['all', '全部随机']].map(([v, t]) => `<button type="button" aria-pressed="${S.set.scope === v}" data-s="${v}">${t}</button>`).join('');
  $('autoSpeak').checked = !!S.set.auto;
  if (!$('syncMsg').textContent) setSyncOk();
}
$('segN').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.set.n = +b.dataset.n; queue(); renderHome(); });
$('segScope').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.set.scope = b.dataset.s; queue(); renderHome(); });
$('autoSpeak').addEventListener('change', e => { S.set.auto = e.target.checked; queue(); });

// ---------- sessions ----------
let Q = null;
function startLearn(review) {
  const items = review ? shuffle(byStatus(2)).slice(0, S.set.n) : buildLearn(S.set.n);
  if (!items.length) { renderHome(); return; }
  Q = { mode: 'learn', review, items: items.map(i => ({ i })), pos: 0, total: items.length, wrong: [], right: 0, back: {} };
  show('study'); renderCard();
}
function startQuiz() {
  const n = S.set.n, seen = Object.keys(S.p).map(Number);
  const reals = shuffle(seen).slice(0, Math.ceil(n / 2)).map(i => ({ i, real: true }));
  const fakes = shuffle(F.slice()).slice(0, n - reals.length).map(([f, s]) => ({ fake: f, src: s, real: false }));
  Q = { mode: 'quiz', items: shuffle([...reals, ...fakes]), pos: 0, wrong: [], right: 0 };
  Q.total = Q.items.length;
  show('study'); renderCard();
}
function cur() { return Q.items[Q.pos]; }
function renderCard() {
  const it = cur();
  $('pnum').textContent = `${Math.min(Q.pos + 1, Q.items.length)}/${Q.items.length}`;
  $('pbar').style.width = (Q.pos / Q.items.length * 100) + '%';
  $('cWord').textContent = it.fake || W[it.i][0];
  $('cBack').hidden = true; $('cVerdict').hidden = true; $('bNext').hidden = true;
  Q.answered = false;
  const learn = Q.mode === 'learn';
  $('ansLearn').hidden = !learn; $('ansQuiz').hidden = learn; $('cHint').hidden = !learn;
  if (S.set.auto) speak();
}
function reveal() {
  const it = cur(); if (it.fake) return;
  $('cGloss').textContent = W[it.i][1];
  $('cTag').textContent = CAT[W[it.i][2]] + ' · 第' + W[it.i][3] + '天';
  $('cBack').hidden = false; $('cHint').hidden = true;
}
function next() { Q.pos++; if (Q.pos >= Q.items.length) return finish(); renderCard(); }
function answerLearn(known) {
  if (Q.answered) return;
  const it = cur(); mark(it.i, known);
  if (known) { Q.right++; next(); return; }
  Q.answered = true;
  if (!Q.wrong.includes(it.i)) Q.wrong.push(it.i);
  Q.back[it.i] = (Q.back[it.i] || 0) + 1;
  if (Q.back[it.i] <= 2) {   // show it again a few cards later, at most twice per session
    const at = Math.min(Q.items.length, Q.pos + 4 + Math.floor(Math.random() * 3));
    Q.items.splice(at, 0, { i: it.i });
  }
  reveal(); $('ansLearn').hidden = true; $('bNext').hidden = false;
}
function answerQuiz(saysReal) {
  if (Q.answered) return; Q.answered = true;
  const it = cur(), ok = saysReal === it.real;
  const v = $('cVerdict'); v.hidden = false; v.className = 'verdict ' + (ok ? 'ok' : 'no');
  if (it.real) {
    v.textContent = ok ? '✓ 对，是真词' : '✗ 这是真词';
    reveal();
    if (!ok) { mark(it.i, false); Q.wrong.push(['真', W[it.i][0], W[it.i][1]]); } else Q.right++;
  } else {
    v.textContent = (ok ? '✓ 对，是假词' : '✗ 这是假词') + `（由 ${it.src} 改的）`;
    if (!ok) Q.wrong.push(['假', it.fake, '由 ' + it.src + ' 改']); else Q.right++;
  }
  $('ansQuiz').hidden = true; $('bNext').hidden = false;
}
function finish() {
  show('done'); flush();
  if (Q.mode === 'quiz') {
    $('dTitle').textContent = `正确率 ${Math.round(Q.right / Q.total * 100)}%`;
    $('dSub').textContent = `${Q.total} 题，对 ${Q.right} 题。判错的真词已加入“不认识”。`;
    $('dListTitle').textContent = '判错的题';
    $('dList').innerHTML = Q.wrong.map(([k, w, g]) => `<div><span>${k} · ${esc(w)}</span><span>${esc(g)}</span></div>`).join('') || '<p class="note">全对。</p>';
  } else {
    $('dTitle').textContent = '本组完成';
    $('dSub').textContent = `${Q.total} 个词，认识 ${Q.total - Q.wrong.length} 个，不认识 ${Q.wrong.length} 个（已记录，下次优先出现）。`;
    $('dListTitle').textContent = '这组不认识的词';
    $('dList').innerHTML = Q.wrong.map(i => `<div><span>${esc(W[i][0])}</span><span>${esc(W[i][1])}</span></div>`).join('') || '<p class="note">全部认识。</p>';
  }
}

// ---------- speech ----------
let voice = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); voice = vs.find(v => /en-US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; } catch (e) {} }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } else { $('speakBtn').hidden = true; }
function speak() {
  try {
    const it = cur(); if (!it) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(it.fake || W[it.i][0]);
    u.lang = 'en-US'; u.rate = 0.9; if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- events ----------
$('goLearn').onclick = () => startLearn(false);
$('goReview').onclick = () => startLearn(true);
$('goQuiz').onclick = startQuiz;
$('quit').onclick = () => { flush(); renderHome(); show('home'); };
$('dHome').onclick = () => { renderHome(); show('home'); };
$('dAgain').onclick = () => Q.mode === 'quiz' ? startQuiz() : startLearn(Q.review);
$('card').addEventListener('click', e => { if (e.target.closest('#speakBtn')) return; if (Q && Q.mode === 'learn' && !Q.answered) reveal(); });
$('speakBtn').onclick = e => { e.stopPropagation(); speak(); };
$('bYes').onclick = () => answerLearn(true);
$('bNo').onclick = () => answerLearn(false);
$('bReal').onclick = () => answerQuiz(true);
$('bFake').onclick = () => answerQuiz(false);
$('bNext').onclick = next;
let resetArmed = false;
$('resetBtn').onclick = async () => {
  if (!resetArmed) { resetArmed = true; $('resetBtn').textContent = '再点一次确认清空'; setTimeout(() => { resetArmed = false; $('resetBtn').textContent = '清空全部进度'; }, 4000); return; }
  resetArmed = false; $('resetBtn').textContent = '清空全部进度';
  S = blank(); for (let d = 1; d <= 6; d++) dirty.add(d); metaDirty = true; await flush(); renderHome();
};

// ---------- start ----------
(async () => {
  if (await loadData()) { await loadProgress(); renderHome(); show('home'); }
  else show('importView');
})();
</script>
